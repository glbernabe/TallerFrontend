
name: Lighthouse CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Performance Tests

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Construir Next.js en producción
      - name: Build application
        run: npm run build
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

      # 5. Ejecutar Lighthouse CI
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

      # 6. Guardar informes incluso si Lighthouse falla
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ github.run_number }}
          path: |
            lighthouse-reports/
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
